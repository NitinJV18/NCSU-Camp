<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolfpack AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Univers+LT+Std:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ncsu-red: #CC0000;
            --ncsu-white: #FFFFFF;
            --ncsu-black: #000000;
            --chat-bg: #F8F9FA;
            --ai-bubble: #F1F3F4;
            --user-bubble: var(--ncsu-red);
            --header-font: 'Libre Baskerville', serif;
            --body-font: 'Univers LT Std', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--body-font);
            background-color: #f0f0f0; /* Overall page background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 400px; /* Adjust as needed */
            height: 600px; /* Adjust as needed */
            background-color: var(--ncsu-white);
            border-radius: 20px; /* Soft edges */
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); /* Soft shadow */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 15px;
            background-color: var(--ncsu-white);
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header img.logo {
            height: 30px;
        }

        .chat-header h1 {
            font-family: var(--header-font);
            font-size: 1.2rem;
            color: var(--ncsu-black);
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px; /* Softer edges */
            line-height: 1.4;
            position: relative;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-bubble);
            color: var(--ncsu-black);
            border-bottom-left-radius: 5px; /* Slightly distinct AI corner */
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            color: var(--ncsu-white);
            border-bottom-right-radius: 5px; /* Slightly distinct user corner */
        }

        .ai-icon {
            width: 24px;
            height: 24px;
            position: absolute;
            left: -32px;
            top: 10px;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px; /* Fully rounded input */
            outline: none;
            font-family: var(--body-font);
        }

        #sendBtn {
            background-color: var(--ncsu-red);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 25px; /* Rounded button */
            font-family: var(--body-font);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        #sendBtn:hover {
            background-color: #aa0000;
        }

        /* --- Gemini Response Handling (Markdown) --- */
        .message strong { font-weight: bold; }
        .message em { font-style: italic; }
        .message code { background: rgba(0,0,0,0.05); padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        .message ul, .message ol { padding-left: 20px; margin-top: 5px; }
        .message li { margin-bottom: 3px; }
        .message h1, .message h2, .message h3 { font-size: 1.1em; margin-top: 5px; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="chat-container">
        <header class="chat-header">
            <img src="https://branding.ncsu.edu/logos/logos-main/WolfpackLogo_Block-S_Red.png" alt="NCSU Logo" class="logo">
            <h1>Wolfpack AI Chat</h1>
            <div style="width:30px;"></div> </header>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <img src="https://branding.ncsu.edu/wp-content/uploads/2018/06/Icon_WolfpackRed_BlockS_24.png" alt="AI Icon" class="ai-icon">
                <p>Hello, how can I help you today? Ask me about NC State or anything else!</p>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Message Wolfpack AI...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        function renderMarkdown(text) {
            // Simple markdown-to-HTML converter
            text = text
                .replace(/^#\s+(.*$)/gim, '<h1>$1</h1>') // H1
                .replace(/^##\s+(.*$)/gim, '<h2>$1</h2>') // H2
                .replace(/^###\s+(.*$)/gim, '<h3>$1</h3>') // H3
                .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>') // Bold
                .replace(/\*(.*?)\*/gim, '<em>$1</em>') // Italics
                .replace(/```(.*?)```/gim, '<pre><code>$1</code></pre>') // Code Block
                .replace(/`(.*?)`/gim, '<code>$1</code>'); // Inline Code

            // Simple handling for lists (unordered and ordered)
            text = text.replace(/^\s*\n\*/gm, '<ul>\n*');
            text = text.replace(/^\*/gm, '<li>');
            text = text.replace(/<li>(.*?)\n/gm, '<li>$1</li>\n');
            text = text.replace(/(\n<li>.*?<\/li>\n)+/gm, '<ul>$0</ul>');

            text = text.replace(/^\s*\n\d+\./gm, '<ol>\n1.');
            text = text.replace(/^\d+\./gm, '<li>');
            text = text.replace(/<li>(.*?)\n/gm, '<li>$1</li>\n');
            text = text.replace(/(\n<li>.*?<\/li>\n)+/gm, '<ol>$0</ol>');

            return text;
        }

        // CHAT LOGIC

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const messageP = document.createElement('p');

            if (sender === 'ai') {
                // Add AI icon
                const aiIcon = document.createElement('img');
                aiIcon.src = "https://branding.ncsu.edu/wp-content/uploads/2018/06/Icon_WolfpackRed_BlockS_24.png";
                aiIcon.alt = "AI Icon";
                aiIcon.className = "ai-icon";
                messageDiv.appendChild(aiIcon);

                // Interpret Markdown for AI response
                messageP.innerHTML = renderMarkdown(text);
            } else {
                messageP.textContent = text;
            }

            messageDiv.appendChild(messageP);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll
        }

        // Placeholder function for sending to Gemini API
        function sendMessageToGemini(text) {
            console.log(`Sending to Gemini: ${text}`);
            appendMessage(text, 'user');
            userInput.value = '';

            // Simulate AI response with formatting to test renderer
            setTimeout(() => {
                const simulatedResponse = `That's interesting! NC State is known for many things. Here are a few details about the university:\n\n* **Founded:** 1887\n* **Type:** Public land-grant research university\n* **Mascot:** Mr. and Ms. WUF (Wolfpack)\n\n### Notable Areas of Study:\n\n* Engineering\n* Agriculture and Life Sciences\n* Veterinary Medicine\n\nYou might also want to check out the **Hunt Library**, which is a world-class facility. Let me know if you have more questions!`;
                appendMessage(simulatedResponse, 'ai');
            }, 1000);

            // TODO: INTEGRATE ACTUAL GEMINI API FETCH HERE
            /*
            fetch('/your-api-endpoint', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            })
            .then(response => response.json())
            .then(data => {
                appendMessage(data.response, 'ai'); // data.response contains the Gemini markdown
            })
            .catch(error => {
                console.error('Error connecting to Gemini:', error);
                appendMessage('Sorry, I had trouble connecting.', 'ai');
            });
            */
        }

        sendBtn.addEventListener('click', () => {
            if (userInput.value.trim() !== '') {
                sendMessageToGemini(userInput.value);
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && userInput.value.trim() !== '') {
                sendMessageToGemini(userInput.value);
            }
        });
    </script>
</body>
</html>
