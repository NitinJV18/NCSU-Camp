<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCSU Gemini Chat</title>
    <style>
        :root {
            --ncsu-red: #CC0000;
            --ncsu-white: #FFFFFF;
            --ncsu-gray: #EDEDED;
            --ncsu-black: #000000;
        }

        body {
            font-family: "UniversLTStd", Helvetica, Arial, sans-serif;
            background-color: var(--ncsu-gray);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: var(--ncsu-red);
            color: var(--ncsu-white);
            width: 100%;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        main {
            flex: 1;
            width: 90%;
            max-width: 800px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #chat-window {
            flex: 1;
            background-color: var(--ncsu-white);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 400px;
        }

        .message {
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 75%;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background-color: var(--ncsu-gray);
            color: var(--ncsu-black);
            align-self: flex-end;
        }

        .message.gemini {
            background-color: var(--ncsu-red);
            color: var(--ncsu-white);
            align-self: flex-start;
        }

        .message.error {
            background-color: #ffe0e0;
            color: #cc0000;
            border: 1px solid #cc0000;
            align-self: center;
        }

        #input-area {
            display: flex;
            gap: 10px;
            background-color: var(--ncsu-white);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--ncsu-gray);
            border-radius: 4px;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--ncsu-red);
        }

        button {
            padding: 12px 24px;
            background-color: var(--ncsu-red);
            color: var(--ncsu-white);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #990000;
        }
    </style>
</head>
<body>

    <header>
        <h1>WOLFPACK AI CHAT</h1>
    </header>

    <main>
        <div id="chat-window">
            <div class="message gemini">Go Pack! How can I help you today?</div>
        </div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Ask Gemini something...">
            <button id="send-btn">Send</button>
        </div>
    </main>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, 'user');
            userInput.value = '';

            addMessage("Thinking...", 'gemini');
            const thinkingMessage = chatWindow.lastChild;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                if (response.ok) {
                    thinkingMessage.textContent = data.text;
                } else {
                    thinkingMessage.textContent = `Error: ${data.error}`;
                    thinkingMessage.classList.add('error');
                }

            } catch (error) {
                thinkingMessage.textContent = "Fatal Connection Error.";
                thinkingMessage.classList.add('error');
                console.error("Fetch error:", error);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
